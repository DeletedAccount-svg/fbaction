name: PH News Instagram REEL (Animated Video)

on:
  workflow_dispatch:       # trigger manually or via cron-job.org
  # Uncomment below to auto-post daily at 8am and 8pm Manila time (UTC+8):
  # schedule:
  #   - cron: '0 0 * * *'    # 8am Manila
  #   - cron: '0 12 * * *'   # 8pm Manila

jobs:
  post-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg for moviepy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow moviepy numpy

      - name: Run PH News Instagram Reel Poster
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IMGBB_API_KEY:   ${{ secrets.IMGBB_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          PAGE_NAME:       ${{ secrets.PAGE_NAME }}
        run: python post_ph_news_reel.py
