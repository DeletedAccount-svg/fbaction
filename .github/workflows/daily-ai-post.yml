name: Daily AI News Post to Facebook
on:
  schedule:
    - cron: '0 23 * * *'  # 7AM Manila (GMT+8)
    - cron: '0 16 * * *'  # 12AM Manila (GMT+8, midnight)
    - cron: '0 9 * * *'   # 5PM Manila (GMT+8)
  workflow_dispatch:
jobs:
  post-ai-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5          # 🦴 WAS v4.2.2 — now Node 24 native!
      - name: Setup Python
        uses: actions/setup-python@v6      # 🦴 WAS v5.6.0 — now Node 24 native!
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch and post AI news to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
        run: python fetch_and_post.py
      - name: Save posted URLs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_urls.json
          git diff --staged --quiet || git commit -m "chore: track posted URL [skip ci]"
          git push
