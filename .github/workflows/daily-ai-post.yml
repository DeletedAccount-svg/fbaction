name: Daily AI News Post to Facebook

on:
  schedule:
    - cron: '0 23 * * *'  # Every day at 11PM UTC = 7AM Manila (GMT+8)
  workflow_dispatch:       # Also allow manual trigger anytime

jobs:
  post-ai-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to save posted_urls.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and post AI news to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python fetch_and_post.py

      - name: Save posted URLs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_urls.json
          git diff --staged --quiet || git commit -m "chore: track posted URL [skip ci]"
          git push
