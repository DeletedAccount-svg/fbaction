name: Daily AI News Post with Image Text

on:
  schedule:
    - cron: '0 23 * * *'  # 7AM Manila (GMT+8)
    - cron: '0 4 * * *'   # 12PM Manila (GMT+8, noon)
    - cron: '0 9 * * *'   # 5PM Manila (GMT+8)
  workflow_dispatch:
jobs:
  post-ai-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 Pillow

      - name: Check music assets
        run: |
          if [ -z "$(find assets/music -type f -name '*.mp3' 2>/dev/null)" ]; then
            echo "::warning::No mp3 tracks found under assets/music/. Reels will be uploaded without background music."
          else
            echo "Music tracks found:"
            find assets/music -type f -name '*.mp3'
          fi

      - name: Run AI News Poster Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          MUSIC_GENRE: suspense
        run: python post_ai_news.py
