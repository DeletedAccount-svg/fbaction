name: Daily AI News Post with Image

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  post-ai-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch News, Download Image, and Post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }} 
        run: |
          python -c "
          import os
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          FB_PAGE_ID = os.environ.get('FB_PAGE_ID')
          FB_ACCESS_TOKEN = os.environ.get('FB_ACCESS_TOKEN')
          NEWS_API_KEY = os.environ.get('NEWS_API_KEY', '')

          # ---------------------------------------------------------
          # STEP 1: FETCH THE AI NEWS
          # ---------------------------------------------------------
          news_url = f'https://newsapi.org/v2/everything?q=artificial+intelligence&sortBy=publishedAt&pageSize=1&apiKey={NEWS_API_KEY}'
          response = requests.get(news_url)
          data = response.json()
          
          if data.get('status') != 'ok' or not data.get('articles'):
              print('Failed to fetch news or no articles found.')
              exit(1)
              
          article = data['articles'][0]
          title = article['title']
          source_url = article['url']
          description = article.get('description', '')
          
          # GET THE IMAGE DIRECTLY FROM THE API DATA
          api_image_url = article.get('urlToImage', '')
          print(f'Fetched Article: {title}')

          # ---------------------------------------------------------
          # STEP 2: EXTRACT AND DOWNLOAD THE IMAGE LOCALLY
          # ---------------------------------------------------------
          image_url = None
          image_path = '/tmp/news_image.jpg'
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
          
          # 2A: Try using the image URL provided by the News API
          if api_image_url:
              image_url = api_image_url
              print(f'Image URL from API: {image_url}')
          else:
              # 2B: Fallback to scraping the website if API didn't provide an image
              print('No image in API. Trying to scrape source URL...')
              try:
                  page_response = requests.get(source_url, headers=headers, timeout=10)
                  soup = BeautifulSoup(page_response.text, 'html.parser')
                  og_image = soup.find('meta', property='og:image')
                  if not og_image:
                      og_image = soup.find('meta', attrs={'name': 'twitter:image'})
                      
                  if og_image and og_image.get('content'):
                      image_url = urljoin(source_url, og_image['content'])
                      print(f'Image URL from scraping: {image_url}')
              except Exception as e:
                  print(f'Error scraping for image: {e}')

          # 2C: Download the image to the GitHub Action runner
          download_success = False
          if image_url:
              try:
                  img_response = requests.get(image_url, headers=headers, timeout=10)
                  content_type = img_response.headers.get('Content-Type', '')
                  
                  if img_response.status_code == 200 and 'image' in content_type:
                      with open(image_path, 'wb') as f:
                          f.write(img_response.content)
                      download_success = True
                      print('Image successfully downloaded locally.')
                  else:
                      print(f'Failed to download image. Status: {img_response.status_code}, Type: {content_type}')
              except Exception as e:
                  print(f'Error downloading image: {e}')

          # ---------------------------------------------------------
          # STEP 3: UPLOAD TO FACEBOOK
          # ---------------------------------------------------------
          message = f'🤖 {title}\n\n{description}\n\nRead more: {source_url}\n\n#AI #ArtificialIntelligence #TechNews'

          if download_success and os.path.exists(image_path):
              # Upload as a PHOTO. This guarantees it shows the image, not a website preview.
              fb_api_url = f'https://graph.facebook.com/v19.0/{FB_PAGE_ID}/photos'
              print('Uploading local image file to Facebook...')
              
              with open(image_path, 'rb') as img_file:
                  payload = {
                      'message': message,
                      'access_token': FB_ACCESS_TOKEN
                  }
                  files = {
                      'source': (os.path.basename(image_path), img_file)
                  }
                  fb_response = requests.post(fb_api_url, data=payload, files=files)
          else:
              # Absolute worst-case fallback if no image exists at all
              fb_api_url = f'https://graph.facebook.com/v19.0/{FB_PAGE_ID}/feed'
              payload = {
                  'message': message,
                  'link': source_url,
                  'access_token': FB_ACCESS_TOKEN
              }
              print('No valid image found. Posting text and link to Facebook...')
              fb_response = requests.post(fb_api_url, data=payload)

          if fb_response.status_code == 200:
              print('Successfully posted to Facebook!')
          else:
              print(f'Failed to post to Facebook. Response: {fb_response.text}')
              exit(1)
          "
