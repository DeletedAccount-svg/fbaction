name: World News Facebook REEL (Animated Video)

on:
  workflow_dispatch:       # trigger manually or via cron-job.org
  # Uncomment below to auto-post on a schedule (times are UTC):
  # schedule:
  #   - cron: '0 0 * * *'    # once a day at midnight UTC
  #   - cron: '0 12 * * *'   # and again at noon UTC

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so GITHUB_TOKEN can create/delete releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg for moviepy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow "moviepy<2" numpy

      - name: Run World News Facebook Reel Poster
        env:
          FB_PAGE_ID:       ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN:  ${{ secrets.FB_ACCESS_TOKEN }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          PAGE_NAME:        ${{ secrets.PAGE_NAME }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python post_world_news_reel.py
